name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Oficjalne actions/deploy-pages nie potrafi UTWORZYĆ strony Pages na tym tokenie
# (ten sam problem co w anime-buddy). Publikacja do gałęzi gh-pages działa
# i to ona jest serwowana pod https://megabomb420.github.io/szum/
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
